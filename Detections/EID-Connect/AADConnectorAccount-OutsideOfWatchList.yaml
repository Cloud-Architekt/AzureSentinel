id: 86e9ba6f-d1ed-48b8-a849-c26f77db8c1b
name: Detection of Microsoft Entra Connect accounts outside of WatchLists
version: 1.1.0
kind: Scheduled
description: |
  User account with directory role membership to "Directory Synchronization Accounts" or "On Premises Directory Sync Account",
  or with a successful sign-in to one of the Microsoft Entra Connect APIs, which is not tagged as Entra Connect / Azure AD Connect
  account in the "ServiceAccounts" watchlist. Indicator of creating an Entra Connect connector account as backdoor.
  The result set states the concrete reason why the incident was raised: the matched synchronization role and/or the
  Entra Connect API that was used for the sign-in, including source IP address, location and sign-in count.
severity: Medium
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
  - PrivilegeEscalation
  - InitialAccess
  - DefenseEvasion
relevantTechniques:
  - T1098
  - T1078
query: |
  // Known Microsoft Entra Connect API application IDs
  let EntraConnectAppIds = dynamic(["cb1056e2-e479-49de-ae31-7812af012ed8", "6eb59a73-39b2-4c23-a70f-e2e3ce8965b1"]);
  let SyncRoles = dynamic(["Directory Synchronization Accounts", "On Premises Directory Sync Account"]);
  // Reason 1: accounts holding one of the directory synchronization roles
  let DirSyncRoleAssignedMembers = (
      IdentityInfo
      | where TimeGenerated > ago(14d)
      | summarize arg_max(TimeGenerated, *) by AccountObjectId
      | where IsAccountEnabled == true
      | where AssignedRoles has_any (SyncRoles)
      | where isnull(DeletedDateTime) or DeletedDateTime > now()
      | mv-expand AssignedRole = todynamic(tostring(AssignedRoles)) to typeof(string)
      | where AssignedRole in (SyncRoles)
      | summarize AssignedSyncRoles = strcat_array(make_set(AssignedRole), ", ") by AccountObjectId
      | extend DetectionReason = strcat("Directory synchronization role assigned: ", AssignedSyncRoles)
  );
  // Reason 2: successful sign-in to an Entra Connect API or with the Entra Connect naming pattern
  let DirSyncNamedUsers = (
      SigninLogs
      | where ingestion_time() > ago(70m)
      | where ResultType == 0
      | where (UserPrincipalName startswith "sync_" and UserPrincipalName endswith "onmicrosoft.com")
          or AppId in (EntraConnectAppIds)
      | extend EntraConnectApi = case(
          AppId == "cb1056e2-e479-49de-ae31-7812af012ed8", "Microsoft Azure AD Sync (AADSync)",
          AppId == "6eb59a73-39b2-4c23-a70f-e2e3ce8965b1", "Microsoft Entra Connect Sync V2",
          "")
      | extend SignInReason = iff(isnotempty(EntraConnectApi),
          strcat("Successful sign-in to Entra Connect API: ", EntraConnectApi),
          "Successful sign-in of account matching Entra Connect naming pattern (sync_*@*.onmicrosoft.com)")
      | extend EntraConnectAppLabel = strcat(iff(isnotempty(EntraConnectApi), EntraConnectApi, AppDisplayName), " [", AppId, "]")
      | extend SignInLocation = strcat(tostring(LocationDetails.countryOrRegion), "/", tostring(LocationDetails.city))
      | summarize
          DetectionReason = strcat_array(make_set(SignInReason), " / "),
          EntraConnectAppsUsed = strcat_array(make_set(EntraConnectAppLabel, 10), ", "),
          SignInIPAddresses = strcat_array(make_set(IPAddress, 10), ", "),
          SignInLocations = strcat_array(make_set(SignInLocation, 10), ", "),
          SuccessfulSignIns = count(),
          LastSignIn = max(TimeGenerated)
          by AccountObjectId = UserId
  );
  // Explicitly tagged Microsoft Entra Connect / Azure AD Connect accounts in the ServiceAccounts watchlist
  let WatchList = _GetWatchlist('ServiceAccounts')
      | where (['Tags'] has "Azure AD Connect") or (['Tags'] has "Entra Connect")
      | project AccountObjectId = ['Service AAD Object Id'];
  // Combine both detection paths, drop all known accounts and keep the reason why the account matched
  union isfuzzy=true DirSyncRoleAssignedMembers, DirSyncNamedUsers
  | summarize
      DetectionReason = strcat_array(make_set(DetectionReason), " + "),
      AssignedSyncRoles = take_anyif(AssignedSyncRoles, isnotempty(AssignedSyncRoles)),
      EntraConnectAppsUsed = take_anyif(EntraConnectAppsUsed, isnotempty(EntraConnectAppsUsed)),
      SignInIPAddresses = take_anyif(SignInIPAddresses, isnotempty(SignInIPAddresses)),
      SignInLocations = take_anyif(SignInLocations, isnotempty(SignInLocations)),
      SuccessfulSignIns = sum(SuccessfulSignIns),
      LastSignIn = max(LastSignIn)
      by AccountObjectId
  | where AccountObjectId !in (WatchList)
  | extend
      AssignedSyncRoles = iff(isempty(AssignedSyncRoles), "None", AssignedSyncRoles),
      EntraConnectAppsUsed = iff(isempty(EntraConnectAppsUsed), "No Entra Connect API sign-in in this interval", EntraConnectAppsUsed),
      SignInIPAddresses = iff(isempty(SignInIPAddresses), "n/a", SignInIPAddresses),
      SignInLocations = iff(isempty(SignInLocations), "n/a", SignInLocations),
      SuccessfulSignIns = iff(isnull(SuccessfulSignIns), 0, SuccessfulSignIns)
  | join kind=leftouter (
      IdentityInfo
      | where TimeGenerated > ago(14d)
      | summarize arg_max(TimeGenerated, *) by AccountObjectId
      | project AccountObjectId, AccountUPN, AccountDisplayName, AccountCreationTime,
          IsAccountEnabled, UserType, AllAssignedRoles = AssignedRoles, GroupMembership
      )
      on AccountObjectId
  | project
      DetectionReason,
      AssignedSyncRoles,
      EntraConnectAppsUsed,
      SignInIPAddresses,
      SignInLocations,
      SuccessfulSignIns,
      LastSignIn,
      AccountUPN,
      AccountDisplayName,
      AccountObjectId,
      IsAccountEnabled,
      AccountCreationTime,
      UserType,
      AllAssignedRoles,
      GroupMembership
suppressionEnabled: false
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: false
    reopenClosedIncident: false
    lookbackDuration: 4h
    matchingMethod: AllEntities
    groupByEntities: []
    groupByAlertDetails:
    groupByCustomDetails: []
eventGroupingSettings:
  aggregationKind: SingleAlert
alertDetailsOverride:
  alertDisplayNameFormat: 'Entra Connect account outside of WatchList - {{AccountUPN}}'
  alertDescriptionFormat: |-
    Account {{AccountUPN}} ({{AccountObjectId}}) was flagged because: {{DetectionReason}}.
    Assigned synchronization role(s): {{AssignedSyncRoles}}
    Entra Connect API used for sign-in: {{EntraConnectAppsUsed}}
    Successful sign-ins: {{SuccessfulSignIns}} - last sign-in: {{LastSignIn}}
    Sign-in source IP(s): {{SignInIPAddresses}} - location(s): {{SignInLocations}}
    The account is not tagged as "Entra Connect" or "Azure AD Connect" in the ServiceAccounts watchlist.
  alertDynamicProperties: []
customDetails:
  DetectionReason: DetectionReason
  AssignedSyncRoles: AssignedSyncRoles
  EntraConnectApi: EntraConnectAppsUsed
  SignInIPAddresses: SignInIPAddresses
  SignInLocations: SignInLocations
  SuccessfulSignIns: SuccessfulSignIns
  LastSignIn: LastSignIn
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPN
      - identifier: ObjectGuid
        columnName: AccountObjectId
      - identifier: DisplayName
        columnName: AccountDisplayName
suppressionDuration: 1h